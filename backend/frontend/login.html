<!DOCTYPE html>
<html>

<head>

<title>
4Three Data Manager
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>
4Three Data Manager
</h1>



<button onclick="logout()">
Logout
</button>


<br><br>



<div class="box">


<h2>
Add New Data
</h2>


<input id="name" placeholder="Name">

<input id="sponsor" placeholder="Sponsor">

<input id="code" placeholder="Code">

<input id="gen" placeholder="GEN">

<input id="pin" placeholder="Pin">


<button onclick="addRecord()">
Save
</button>


</div>




<br>



<input
id="search"
placeholder="Search Name, Code, Sponsor, GEN, Pin"
>



<br><br>



<table>


<thead>

<tr>

<th>Name</th>

<th>Sponsor</th>

<th>Code</th>

<th>GEN</th>

<th>Pin</th>

<th>Action</th>


</tr>


</thead>



<tbody id="recordsTable">


</tbody>


</table>



<script src="dashboard.js"></script>


</body>


</html>
