<!DOCTYPE html>
<html>

<head>

<title>
4Three Data Manager
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>
4Three Data Manager
</h1>


<button onclick="changePassword()">
Change Password
</button>


<button onclick="logout()">
Logout
</button>

<button onclick="clearAllData()" class="danger">
Clear All Data
</button>

<h2>Upload Excel</h2>

<input type="file" id="excelFile">

<button onclick="uploadExcel()">
Upload Excel
</button>

<h2>
Add New Data
</h2>


<input id="name" placeholder="Name">

<input id="sponsor" placeholder="Sponsor">

<input id="code" placeholder="Code">

<input id="gen" placeholder="GEN">

<input id="pin" placeholder="Pin">


<button onclick="addRecord()">
Save
</button>




<br><br>


<input
id="search"
placeholder="Search Name, Code, Sponsor, GEN, Pin"
onkeyup="searchData()"
>



<table class="excel-table">


<thead>

<tr>


<th>Name</th>

<th>Code</th>

<th>Pin</th>

<th>Suponsor ID</th>

<th>GEN</th>

<th>Action</th>


</tr>


</thead>



<tbody id="recordsTable">


</tbody>



</table>



<script src="dashboard.js"></script>


</body>


</html>
